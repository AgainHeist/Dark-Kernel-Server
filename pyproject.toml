[project]
name = "again-heist"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.162.2",
    "uvicorn==0.54.0",
    "httpx==0.28.1",
    "SQLAlchemy==2.1.8",
    "alembic==1.20.1",
    "pydantic==2.14.3",
    "pydantic-settings==2.16.2",
    "pwdlib[argon2]==0.3.1",
    "PyJWT==2.15.1",
    "PyMySQL==1.2.4",
    "python-multipart==0.0.33",
    "python-dotenv==1.2.4"
]

[project.optional-dependencies]
test = [
    "pytest==9.2.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
